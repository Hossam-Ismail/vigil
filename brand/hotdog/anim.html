<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--t:0}
body{width:446px;height:752px;background:#2A2D30;color:#F2F2F0;font-family:'Chakra Petch',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.a{animation-duration:4.2s;animation-timing-function:linear;animation-fill-mode:both;animation-play-state:paused;animation-delay:calc(var(--t) * -1s)}
.bar{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;position:relative}
.bar>span{font-weight:600;font-size:22px;letter-spacing:.3em}
.st{position:absolute;right:18px;font:500 13px 'JetBrains Mono',monospace;letter-spacing:.14em}
.st1{color:#F5A524;animation-name:st1}.st2{color:#A3A9AE;animation-name:st2}
@keyframes st1{0%,8%,16%,24%,32%{opacity:1}4%,12%,20%,28%{opacity:.35}37.9%{opacity:1}38%,100%{opacity:0}}
@keyframes st2{0%,37.9%{opacity:0}38%,100%{opacity:1}}
.feed{position:relative;flex:1;overflow:hidden;background:#222528}
.feed img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(1.35) contrast(1.05)}
.cam{position:absolute;left:14px;top:12px;font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em}
.scan{position:absolute;left:0;right:0;height:3px;background:#C8F560;box-shadow:0 0 18px 6px rgba(200,245,96,.45);animation-name:scan}
@keyframes scan{0%{top:0;opacity:1}17%{top:100%;opacity:1}17.1%{top:0}34%{top:100%;opacity:1}34.1%,100%{opacity:0}}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(200,245,96,.07) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(200,245,96,.07) 0 1px,transparent 1px 22px);animation-name:grid}
@keyframes grid{0%,30%{opacity:1}38%,100%{opacity:0}}
.br{position:absolute;left:3%;top:24%;width:94%;height:50%}
.br i{position:absolute;width:24px;height:24px;border-color:#C8F560;border-style:solid}
.br i:nth-child(1){left:0;top:0;border-width:4px 0 0 4px}.br i:nth-child(2){right:0;top:0;border-width:4px 4px 0 0}
.br i:nth-child(3){left:0;bottom:0;border-width:0 0 4px 4px}.br i:nth-child(4){right:0;bottom:0;border-width:0 4px 4px 0}
.b1{animation-name:b1}.b1 i{border-color:#F5A524}
@keyframes b1{0%,6%{opacity:0;transform:scale(1.35)}20%{opacity:1;transform:scale(1.08)}36%{opacity:1;transform:scale(1.0)}38%,100%{opacity:0}}
.b2{animation-name:b2;outline:1px solid rgba(200,245,96,.45)}
@keyframes b2{0%,37.9%{opacity:0}38%,100%{opacity:1}}
.chip{position:absolute;left:3%;top:calc(24% - 40px);font:700 18px 'JetBrains Mono',monospace;letter-spacing:.08em;padding:5px 12px;background:#F5A524;color:#1E2124;opacity:0}
.c1{animation-name:c1}.c2{animation-name:c2}.c3{animation-name:c3}
@keyframes c1{0%,12%{opacity:0}12.1%,21%{opacity:1}21.1%,100%{opacity:0}}
@keyframes c2{0%,21%{opacity:0}21.1%,29.5%{opacity:1}29.6%,100%{opacity:0}}
@keyframes c3{0%,29.5%{opacity:0}29.6%,37.9%{opacity:1}38%,100%{opacity:0}}
.tag{position:absolute;left:3%;top:calc(24% - 44px);background:#C8F560;color:#1E2124;font:700 22px 'Chakra Petch',sans-serif;letter-spacing:.06em;padding:4px 14px;transform-origin:left bottom;animation-name:tag}
@keyframes tag{0%,37.9%{opacity:0;transform:scale(.6)}39%{opacity:1;transform:scale(1.25)}42%,100%{opacity:1;transform:scale(1)}}
.card{padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px;background:#2A2D30;position:relative;height:150px}
.req{font:500 14px 'JetBrains Mono',monospace;line-height:1.35}.req b{color:#C8F560}
.low{position:absolute;left:18px;right:18px;top:48px;display:flex;flex-direction:column;gap:12px;animation-name:low}
@keyframes low{0%,47%{opacity:0;transform:translateY(40px)}53%,100%{opacity:1;transform:translateY(0)}}
.sent{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#C8F560;height:16px;position:relative}
.sent span{position:absolute;left:0;top:0;white-space:nowrap}
.s1{animation-name:s1}.s2{animation-name:s2}
@keyframes s1{0%,64%{opacity:1}65%,100%{opacity:0}}
@keyframes s2{0%,64%{opacity:0}66%,100%{opacity:1}}
.btns{display:flex;gap:8px}.btns div{flex:1;text-align:center;padding:12px 0;font:500 15px 'JetBrains Mono',monospace;letter-spacing:.18em}
.y{background:#C8F560;color:#1E2124;animation-name:y}.n{border:1px solid rgba(255,255,255,.3)}
@keyframes y{0%,58%{transform:scale(1);filter:none}60%{transform:scale(.93);filter:brightness(1.25)}63%,100%{transform:scale(1);filter:none}}
.tap{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.55);left:95px;bottom:30px;animation-name:tap}
@keyframes tap{0%,56%{opacity:0;transform:scale(.4)}59%{opacity:.9;transform:scale(1)}63%,100%{opacity:0;transform:scale(1.6)}}
</style></head><body>
<div class="bar"><svg width="38" height="38" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V4h13M47 4h13v13M60 47v13H47M17 60H4V47" stroke="#C8F560" stroke-width="3" stroke-linecap="square"/><path d="M15 21.5Q32 11 49 21.5" stroke="#E6EBE8" stroke-width="1.6" opacity="0.55"/><path d="M8 33Q32 12 56 33Q32 52 8 33Z" stroke="#E6EBE8" stroke-width="2.6"/><circle cx="32" cy="32.5" r="9" fill="#C8F560"/><circle cx="32" cy="32.5" r="4.2" fill="#1E2124"/><circle cx="35" cy="29.5" r="1.6" fill="#FFFFFF"/></svg><span>VIGIL</span>
<div class="st st1 a">● ANALYZING</div><div class="st st2 a"><span style="color:#C8F560">●</span> LIVE</div></div>
<div class="feed"><img src="bg_clean_full.png"><div class="grid a"></div><div class="scan a"></div><p class="cam">CAM 01 // KITCHEN</p>
<div class="br b1 a"><i></i><i></i><i></i><i></i></div><div class="br b2 a"><i></i><i></i><i></i><i></i></div>
<p class="chip c1 a">CHECKING 1/3</p><p class="chip c2 a">CHECKING 2/3</p><p class="chip c3 a">CHECKING 3/3</p><p class="tag a">HOT DOG ✓</p></div>
<div class="card"><p class="req"><b>&gt;</b> Text me when there's a hot dog.</p>
<div class="low a"><p class="sent"><span class="s1 a">✓ TEXTED YOU · WAS THIS RIGHT?</span><span class="s2 a">✓ THANKS · VIGIL LEARNED FROM IT</span></p><div class="btns"><div class="y a">YES</div><div class="n">NO</div></div></div><div class="tap a"></div></div>
<script>document.documentElement.style.setProperty('--t', decodeURIComponent(location.hash.slice(1)) || '0')</script>
</body></html>
