<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:446px;height:752px;background:#2A2D30;color:#F2F2F0;font-family:'Chakra Petch',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.bar span{font-weight:600;font-size:22px;letter-spacing:.3em}
.live{margin-left:auto;font:500 13px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#A3A9AE}
.feed{position:relative;flex:1;overflow:hidden;background:#222528}
.feed img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(1.35) contrast(1.05)}
.cam{position:absolute;left:14px;top:12px;font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#F2F2F0}
.box{position:absolute;left:3%;top:24%;width:94%;height:50%;border:1px solid rgba(200,245,96,.4);
background:linear-gradient(#C8F560,#C8F560) left top/22px 4px no-repeat,linear-gradient(#C8F560,#C8F560) left top/4px 22px no-repeat,linear-gradient(#C8F560,#C8F560) right top/22px 4px no-repeat,linear-gradient(#C8F560,#C8F560) right top/4px 22px no-repeat,linear-gradient(#C8F560,#C8F560) left bottom/22px 4px no-repeat,linear-gradient(#C8F560,#C8F560) left bottom/4px 22px no-repeat,linear-gradient(#C8F560,#C8F560) right bottom/22px 4px no-repeat,linear-gradient(#C8F560,#C8F560) right bottom/4px 22px no-repeat}
.tag{position:absolute;left:3%;top:calc(24% - 40px);background:#C8F560;color:#1E2124;font:700 20px 'Chakra Petch',sans-serif;letter-spacing:.06em;padding:4px 12px}
.card{padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px;background:#2A2D30}
.req{font:500 14px 'JetBrains Mono',monospace;color:#F2F2F0;line-height:1.35}.req b{color:#C8F560}
.sent{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#C8F560}
.btns{display:flex;gap:8px}.btns div{flex:1;text-align:center;padding:12px 0;font:500 15px 'JetBrains Mono',monospace;letter-spacing:.18em}
.y{background:#C8F560;color:#1E2124}.n{border:1px solid rgba(255,255,255,.3)}
</style></head><body>
<div class="bar"><svg width="38" height="38" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V4h13M47 4h13v13M60 47v13H47M17 60H4V47" stroke="#C8F560" stroke-width="3" stroke-linecap="square"/><path d="M15 21.5Q32 11 49 21.5" stroke="#E6EBE8" stroke-width="1.6" opacity="0.55"/><path d="M8 33Q32 12 56 33Q32 52 8 33Z" stroke="#E6EBE8" stroke-width="2.6"/><circle cx="32" cy="32.5" r="9" fill="#C8F560"/><circle cx="32" cy="32.5" r="4.2" fill="#1E2124"/><circle cx="35" cy="29.5" r="1.6" fill="#FFFFFF"/></svg><span>VIGIL</span><div class="live"><span style="color:#C8F560">●</span> LIVE</div></div>
<div class="feed"><img src="bg_clean_full.png"><p class="cam">CAM 01 // KITCHEN</p><div class="box"></div><p class="tag">HOT DOG ✓</p></div>
<div class="card"><p class="req"><b>&gt;</b> Text me when there's a hot dog.</p><p class="sent">✓ TEXTED YOU · WAS THIS RIGHT?</p><div class="btns"><div class="y">YES</div><div class="n">NO</div></div></div>
</body></html>
